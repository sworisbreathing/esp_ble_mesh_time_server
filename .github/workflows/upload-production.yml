name: Upload to production
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types:
      - released

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_ble_mesh_time_server: ."
          namespace: "sworisbreathing"
          dry_run: true

  upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - validate
    steps:
      - uses: actions/checkout@v7
      - uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_ble_mesh_time_server: ."
          namespace: "sworisbreathing"
