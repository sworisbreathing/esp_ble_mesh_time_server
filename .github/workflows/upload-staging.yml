name: Upload to staging
on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true

jobs:
  validate_staging:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_ble_mesh_time_server: ."
          namespace: "sworisbreathing"
          registry_url: https://components-staging.espressif.com/
          dry_run: true

  upload_staging:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - validate_staging
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_ble_mesh_time_server: ."
          namespace: "sworisbreathing"
          registry_url: https://components-staging.espressif.com/

  oidc_debug_test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    name: A test of the oidc debugger
    steps:
      - name: Debug OIDC Claims
        uses: steve-todorov/oidc-debugger-action@v1
        with:
          audience: '${{ github.server_url }}/${{ github.repository }}'
