branches:
  - '+([0-9])?(.{+([0-9]),x}).x'
  - 'main'
  - name: 'beta'
    prerelease: true
  - name: 'alpha'
    prerelease: true

plugins:
  - '@semantic-release/commit-analyzer'
  - '@semantic-release/release-notes-generator'
  - - '@semantic-release/exec'
    - prepareCmd: >
        sed -i '0,/^version: .*/s//version: "${nextRelease.version}"/' idf_component.yml
  - '@semantic-release/github'
